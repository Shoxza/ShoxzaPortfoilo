<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  .hv{--asphalt:#1E1D1B;--chalk:#ECE8E1;--dust:#9A958C;--blue:#4781D7;font-family:Archivo,system-ui,sans-serif;color:var(--chalk)}
  .hv .pick{display:flex;gap:8px;margin:0 0 14px}
  .hv .pick button{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid #555;background:transparent;color:inherit;cursor:pointer}
  .hv .pick button[aria-pressed="true"]{background:#ECE8E1;color:#1E1D1B;border-color:#ECE8E1}
  .hv .stage{background:var(--asphalt);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:36px;align-items:flex-end;justify-content:center}
  .hv .big{width:min(520px,100%);height:auto}
  .hv .sizes{display:flex;gap:24px;align-items:flex-end}
  .hv .sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--dust)}
  /* colourways */
  .hv{--up:#2C2B28;--upHi:#45433E;--band:#4781D7;--lo:#ECE8E1;--loSh:#CFCAC1;--num:#ECE8E1;--numStroke:#121110}
  .hv.blue{--up:#3B6FC0;--band:#2C2B28;--num:#ECE8E1;--numStroke:#1E1D1B}
  .hv.deep{--up:#2A4F8F;--band:#1E1D1B;--num:#ECE8E1;--numStroke:#121110}
  .hv.navy{--up:#1C2F55;--band:#1E1D1B;--num:#ECE8E1;--numStroke:#0c0d10}
</style>

<h2>Helmet #26, Leclerc-style layout in your colours (v7): darker blues</h2>
<p class="subtitle">Same helmet, darker blue tops so it sits closer to the asphalt site. Compare the bright racing blue from before with two darker options. The site's glow and accents stay racing blue either way.</p>

<div class="hv deep" id="hv">
  <div class="pick" role="group" aria-label="Colourway">
    <button aria-pressed="false" onclick="cw(this,'blue')">Racing blue (before)</button>
    <button aria-pressed="true" onclick="cw(this,'deep')">Deep blue</button>
    <button aria-pressed="false" onclick="cw(this,'navy')">Midnight navy</button>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="shell5" d="M170 682 C150 650 144 560 146 500 C148 440 154 380 172 320 C192 252 236 188 300 150 C370 112 470 100 560 116 C640 132 700 190 718 270 C732 340 728 440 712 520 C704 556 696 576 688 588 C640 640 520 690 380 694 L220 692 C196 692 178 690 170 682 Z"/>
      <filter id="ink5"><feColorMatrix type="matrix" values="0 0 0 0 0.118  0 0 0 0 0.114  0 0 0 0 0.106  0 0 0 1 0"/></filter>
      <clipPath id="clip5"><use href="#shell5"/></clipPath>
      <radialGradient id="gloss5" cx=".35" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
      <linearGradient id="visor5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2a47"/><stop offset=".5" stop-color="#0d1119"/><stop offset="1" stop-color="#07080b"/></linearGradient>

      <symbol id="h5" viewBox="120 90 640 640">
        <ellipse cx="460" cy="712" rx="230" ry="16" fill="#000" opacity=".35"/>
        <g clip-path="url(#clip5)">
          <!-- upper shell -->
          <rect x="120" y="90" width="640" height="640" fill="var(--up)"/>
          <!-- crown stripes -->
          <path d="M214 262 C280 170 400 128 520 132 C600 136 660 168 700 214" fill="none" stroke="var(--lo)" stroke-width="7"/>
          <path d="M236 236 C300 160 410 118 530 120 C610 124 668 158 708 200" fill="none" stroke="var(--lo)" stroke-width="3"/>
          <!-- upper outlined band framing the side sponsor -->
          <path d="M400 268 L726 214 L740 300 L560 330 L420 336 Z" fill="var(--band)" opacity=".95"/>
          <path d="M400 268 L726 214 L740 300 L560 330 L420 336 Z" fill="none" stroke="var(--lo)" stroke-width="6" stroke-linejoin="round"/>
          <!-- lower chalk section -->
          <path d="M120 498 C300 504 460 512 560 516 L740 460 L760 740 L120 740 Z" fill="var(--lo)"/>
          <path d="M120 600 C300 640 520 660 760 600 L760 740 L120 740 Z" fill="var(--loSh)" opacity=".55"/>
          <!-- angular bands on the chalk -->
          <path d="M318 740 L392 548 L478 552 L410 740 Z" fill="var(--band)"/>
          <path d="M560 700 L630 540 L740 512 L740 600 L660 690 Z" fill="var(--band)"/>
          <!-- boundary pinstripe -->
          <path d="M120 498 C300 504 460 512 560 516 L740 460" fill="none" stroke="var(--band)" stroke-width="7"/>
          <!-- rear-side number -->
          <text x="566" y="446" font-family="Archivo" font-weight="900" font-size="112" style="font-variation-settings:'wdth' 125" fill="var(--num)" stroke="var(--numStroke)" stroke-width="10" paint-order="stroke" letter-spacing="-6" transform="rotate(-4 660 410)">26</text>
          <!-- sponsors -->
          <image href="/files/gtr-logo-hvit.webp" x="520" y="236" width="150" height="66" preserveAspectRatio="xMidYMid meet" transform="rotate(-8 595 269)"/>
          <image href="/files/darling-hvit.svg" x="186" y="574" width="140" height="48" filter="url(#ink5)" transform="rotate(-2 256 598)"/>
          <!-- chin vents -->
          <rect x="150" y="514" width="34" height="12" rx="5" fill="#2a2926"/>
          <rect x="232" y="520" width="84" height="12" rx="5" fill="#2a2926"/>
          <!-- gloss + shading -->
          <rect x="120" y="90" width="640" height="640" fill="url(#gloss5)"/>
          <path d="M250 210 C320 150 420 126 500 130" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".1"/>
        </g>
        <!-- visor strip (chalk) with domain -->
        <path d="M162 338 C260 332 400 328 512 330 L514 386 C400 384 262 386 158 392 Z" fill="#ECE8E1"/>
        <text x="336" y="368" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="27" style="font-variation-settings:'wdth' 115" fill="#1E1D1B" letter-spacing=".5">shoxza.no</text>
        <!-- tinted visor -->
        <path d="M158 392 C262 386 400 384 514 386 L540 400 C552 430 554 470 546 500 L512 516 C420 500 260 492 156 496 C152 460 154 424 158 392 Z" fill="url(#visor5)"/>
        <path d="M176 420 C280 410 400 408 500 412" fill="none" stroke="#4781D7" stroke-width="5" opacity=".45" stroke-linecap="round"/>
        <path d="M190 446 C260 438 330 436 390 437" fill="none" stroke="#fff" stroke-width="3" opacity=".18" stroke-linecap="round"/>
        <!-- visor mechanism -->
        <path d="M512 330 L548 344 C566 384 568 452 554 504 L512 516 C530 470 532 380 512 330 Z" fill="#3a3935"/>
        <circle cx="540" cy="372" r="8" fill="#1E1D1B" stroke="#121110" stroke-width="2"/>
        <circle cx="546" cy="470" r="10" fill="#1E1D1B" stroke="#121110" stroke-width="2"/>
        <!-- visor + shell outlines -->
        <path d="M162 338 C260 332 400 328 512 330 L548 344 C566 384 568 452 554 504 L512 516 C420 500 260 492 156 496 C150 444 152 388 162 338 Z" fill="none" stroke="#121110" stroke-width="3"/>
        <!-- bottom trim -->
        <path d="M172 682 C260 696 420 698 520 670 C600 648 660 618 690 588" fill="none" stroke="#121110" stroke-width="12" stroke-linecap="round"/>
        <use href="#shell5" fill="none" stroke="#121110" stroke-width="3"/>
      </symbol>

      <!-- simplified mark for tiny sizes -->
      <symbol id="h5s" viewBox="120 90 640 640">
        <g clip-path="url(#clip5)">
          <rect x="120" y="90" width="640" height="640" fill="var(--up)"/>
          <path d="M120 498 C300 504 460 512 560 516 L740 460 L760 740 L120 740 Z" fill="var(--lo)"/>
          <path d="M318 740 L392 548 L478 552 L410 740 Z" fill="var(--band)"/>
        </g>
        <path d="M158 350 C262 340 400 336 514 340 L548 360 C562 410 560 470 546 506 L512 516 C420 500 260 492 156 496 C152 450 152 400 158 350 Z" fill="#0b0d12"/>
        <text x="560" y="470" font-family="Archivo" font-weight="900" font-size="190" style="font-variation-settings:'wdth' 125" fill="var(--num)" stroke="var(--numStroke)" stroke-width="14" paint-order="stroke" letter-spacing="-8" text-anchor="middle">26</text>
        <use href="#shell5" fill="none" stroke="#121110" stroke-width="6"/>
      </symbol>
    </defs>
  </svg>

  <div class="stage">
    <svg class="big" viewBox="120 90 640 640" role="img" aria-label="Helmet number 26"><use href="#h5" x="120" y="90" width="640" height="640"/></svg>
    <div class="sizes">
      <figure><svg width="140" viewBox="120 90 640 640"><use href="#h5" x="120" y="90" width="640" height="640"/></svg>Header</figure>
      <figure><svg width="44" viewBox="120 90 640 640"><use href="#h5s" x="120" y="90" width="640" height="640"/></svg>Nav</figure>
      <figure><svg width="22" viewBox="120 90 640 640"><use href="#h5s" x="120" y="90" width="640" height="640"/></svg>Tab icon</figure>
    </div>
  </div>
</div>
<script>
  function cw(btn, mode){
    const el=document.getElementById('hv'); el.classList.remove('blue','deep','navy'); if(mode) el.classList.add(mode);
    btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===btn));
  }
</script>
